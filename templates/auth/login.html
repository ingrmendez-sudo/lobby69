{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LOBBY69</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #a74563; --secondary: #463a6d; --dark: #1a1a2e; --light: #f5f5f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--secondary) 0%, var(--dark) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); padding: 3rem 2rem; max-width: 400px; width: 100%; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .login-header p { color: #666; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block; }
        .form-control { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1rem; font-size: 1rem; width: 100%; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(167, 69, 99, 0.1); outline: none; }
        .btn-login { width: 100%; background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #8b3a4f; }
        .login-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .navbar-top { position: absolute; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar-top a { color: white; text-decoration: none; font-weight: 600; }
        .navbar-top a:hover { color: var(--primary); }
    </style>
</head>
<body>
    <!-- SIMPLE NAVBAR -->
    <div class="navbar-top">
        <a href="/"><i class="fas fa-heart"></i> LOBBY69</a>
        <a href="/">← Volver</a>
    </div>

    <!-- LOGIN FORM -->
    <div class="login-container" style="margin-top: 3rem;">
        <div class="login-header">
            <h1><i class="fas fa-sign-in-alt"></i></h1>
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta LOBBY69</p>
        </div>

        <form method="POST" action="/api/auth/login_user/">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display: flex; justify-content: space-between;">
                <label><input type="checkbox" name="remember"> Recuérdame</label>
                <a href="#" style="color: var(--primary); font-size: 0.9rem;">¿Olvidaste?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
            ¿No tienes cuenta? <a href="{% url 'invitation-request' %}">Solicita una invitación</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
