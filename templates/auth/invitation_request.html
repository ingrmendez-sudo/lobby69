{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Invitación - LOBBY69</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #a74563; --secondary: #463a6d; --dark: #1a1a2e; --light: #f5f5f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--secondary) 0%, var(--dark) 100%); min-height: 100vh; padding: 2rem 0; }
        .navbar-top { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 1rem 2rem; margin-bottom: 2rem; display: flex; justify-content: space-between; }
        .navbar-top a { color: white; text-decoration: none; font-weight: 600; }
        .navbar-top a:hover { color: var(--primary); }
        .invitation-container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); padding: 3rem 2rem; max-width: 600px; margin: 0 auto; }
        .invitation-header { text-align: center; margin-bottom: 2rem; }
        .invitation-header h1 { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block; }
        .form-control { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1rem; font-size: 1rem; width: 100%; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(167, 69, 99, 0.1); outline: none; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
        .checkbox-group { display: flex; align-items: flex-start; margin-bottom: 1rem; }
        .checkbox-group input { margin-right: 0.5rem; margin-top: 0.3rem; }
        .checkbox-group label { font-size: 0.9rem; color: #666; margin: 0; }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #8b3a4f; }
    </style>
</head>
<body>
    <!-- SIMPLE NAVBAR -->
    <div class="navbar-top">
        <a href="/"><i class="fas fa-heart"></i> LOBBY69</a>
        <a href="/">← Volver a Inicio</a>
    </div>

    <!-- FORM CONTAINER -->
    <div class="invitation-container">
        <div class="invitation-header">
            <h1><i class="fas fa-envelope-open-text"></i></h1>
            <h2>Solicitar Invitación</h2>
            <p>Completa el formulario para acceder a LOBBY69</p>
        </div>

        <form method="POST" action="/api/auth/create_invitation_request/">
            {% csrf_token %}

            <h5 style="color: var(--primary); font-weight: 700; margin: 1.5rem 0 1rem;">Información Personal</h5>

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name" class="form-label">Nombre</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="last_name" class="form-label">Apellido</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Tu apellido" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="birthdate" class="form-label">Fecha de Nacimiento</label>
                    <input type="date" id="birthdate" name="birthdate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="gender" class="form-label">Género</label>
                    <select id="gender" name="gender" class="form-control" required>
                        <option value="">Selecciona...</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="NB">No binario</option>
                        <option value="O">Otro</option>
                    </select>
                </div>
            </div>

            <h5 style="color: var(--primary); font-weight: 700; margin: 1.5rem 0 1rem;">¿Qué buscas?</h5>

            <div class="form-group">
                <label for="seeking" class="form-label">Tipo de relación</label>
                <select id="seeking" name="seeking" class="form-control" required>
                    <option value="">Selecciona...</option>
                    <option value="relacion_seria">Relación seria</option>
                    <option value="amistad">Amistad</option>
                    <option value="aventura">Aventura</option>
                    <option value="sin_compromiso">Sin compromiso</option>
                </select>
            </div>

            <div class="form-group">
                <label for="interests" class="form-label">Intereses (opcional)</label>
                <textarea id="interests" name="interests" class="form-control" placeholder="Cuéntanos sobre ti..."></textarea>
            </div>

            <h5 style="color: var(--primary); font-weight: 700; margin: 1.5rem 0 1rem;">Acuerdos</h5>

            <div class="checkbox-group">
                <input type="checkbox" id="terms_accepted" name="terms_accepted" required>
                <label for="terms_accepted">Acepto los Términos y Condiciones</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="privacy_accepted" name="privacy_accepted" required>
                <label for="privacy_accepted">Acepto la Política de Privacidad</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="marketing_consent" name="marketing_consent">
                <label for="marketing_consent">Deseo recibir ofertas de LOBBY69</label>
            </div>

            <button type="submit" class="btn-submit">Enviar Solicitud</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #666; font-size: 0.9rem;">
            ¿Ya tienes acceso? <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 600;">Inicia sesión aquí</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
