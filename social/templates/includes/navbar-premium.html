{% load static %}

<!-- NAVBAR PREMIUM -->
<nav class="navbar-premium">
    <div class="navbar-container">
        <!-- LEFT: LOGO -->
        <div class="navbar-left">
            <a href="/" class="navbar-logo">
                <img src="{% static 'images/logo-lobby69.png' %}" alt="LOBBY69">
                <span>LOBBY69</span>
            </a>
        </div>

        <!-- CENTER: MENU -->
        <div class="navbar-center">
            <div class="nav-item">
                <a href="/mi-dashboard/" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
            </div>
            
            <div class="nav-item">
                <a href="/explorar/" {% if request.resolver_match.url_name == 'explore' %}class="active"{% endif %}>
                    <i class="fas fa-compass"></i>
                    <span>Explorar</span>
                </a>
            </div>
            
            <div class="nav-item">
                <a href="/mensajes/" {% if request.resolver_match.url_name == 'conversations' %}class="active"{% endif %}>
                    <i class="fas fa-comments"></i>
                    <span>Mensajes</span>
                </a>
            </div>
            
            <div class="nav-item">
                <a href="/galeria/" {% if request.resolver_match.url_name == 'gallery' %}class="active"{% endif %}>
                    <i class="fas fa-images"></i>
                    <span>Galería</span>
                </a>
            </div>

            <div class="nav-item">
                <a href="/membresias/" {% if request.resolver_match.url_name == 'memberships' %}class="active"{% endif %}>
                    <i class="fas fa-crown"></i>
                    <span>Membresías</span>
                </a>
            </div>
        </div>

        <!-- RIGHT: ICONS + USER -->
        <div class="navbar-right">
            <!-- NOTIFICACIONES -->
            <button class="nav-icon" id="notifications-btn" title="Notificaciones">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display: none;">0</span>
            </button>

            <!-- TEMA (Dark/Light) -->
            <button class="nav-icon" id="theme-toggle" title="Cambiar tema">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>

            <!-- USUARIO + DROPDOWN -->
            <div class="navbar-user-menu">
                <button class="nav-avatar" id="user-menu-btn" title="Menú de usuario">
                    <img src="{% static 'images/default-avatar.svg' %}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
                </button>

                <div class="user-dropdown" id="user-dropdown">
                    <a href="/mi-perfil/">
                        <i class="fas fa-user"></i>
                        Mi Perfil
                    </a>
                    <a href="/configuracion/">
                        <i class="fas fa-cog"></i>
                        Configuración
                    </a>
                    <a href="/verificacion/">
                        <i class="fas fa-check-circle"></i>
                        Verificación
                    </a>
                    <hr>
                    <a href="/logout/">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
// Toggle User Dropdown
document.getElementById('user-menu-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    const dropdown = document.getElementById('user-dropdown');
    dropdown.classList.toggle('active');
});

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('user-dropdown');
    const userMenu = document.querySelector('.navbar-user-menu');
    
    if (userMenu && !userMenu.contains(e.target)) {
        dropdown.classList.remove('active');
    }
});

// Theme Toggle
document.getElementById('theme-toggle').addEventListener('click', function() {
    const body = document.body;
    const icon = document.getElementById('theme-icon');
    
    body.classList.toggle('dark-mode');
    
    if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
    } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
    }
});

// Load saved theme
window.addEventListener('DOMContentLoaded', function() {
    const theme = localStorage.getItem('theme') || 'light';
    const icon = document.getElementById('theme-icon');
    
    if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
    }
});
</script>
