{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LOBBY69 - Plataforma Premium de Conexiones">
    <title>{% block page_title %}LOBBY69{% endblock %}</title>
    
    {% csrf_token %}

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- DESIGN SYSTEM CSS -->
    <link rel="stylesheet" href="{% static 'css/design-system/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/components/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/components/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/components/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/components/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/components/avatars.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/components/badges.css' %}">
    <link rel="stylesheet" href="{% static 'css/design-system/layouts/feed-layout.css' %}">

    {% block extra_css %}{% endblock %}

    <style>
        body { opacity: 1; transition: opacity 0.3s ease; }
        .loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>

<body>
    {% include 'includes/navbar-premium.html' %}
    
    <main class="main-content">
        {% block main_content %}{% endblock %}
    </main>
    
    {% include 'includes/footer.html' %}

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
